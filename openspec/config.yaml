schema: spec-driven

context: |
  Harrier — зонтичный проект: десктопный и веб-клиент для протокола Matrix,
  форк Cinny (https://github.com/cinnyapp/cinny).

  Состав репозиториев:
    - schadin/harrier-desktop — монорепозиторий десктоп-клиента: React/TypeScript-
      клиент в `client/` и Tauri v2/Rust-обёртка в `src-tauri/`; экспортирован
      сюда как git-подмодуль `desktop/`.
    - schadin/harrier — автономный веб-legacy (React + TypeScript + Vite),
      публикуется на GitHub Pages и получает только критические исправления.
    - Upstream: cinnyapp/cinny, cinnyapp/cinny-desktop; синхронизация прекращена.

  Технологический стек:
    - Бэкенд (десктоп): Tauri v2, Rust, плагины tauri-plugin-* (localhost,
      window-state, clipboard-manager, notification, fs, shell, http, process,
      os, opener, dialog, global-shortcut).
    - Фронтенд (веб): React 18, TypeScript, Vite, matrix-js-sdk, vanilla-extract,
      react-router-dom, TanStack React Query, i18next, jotai.
    - Сборка: npm-скрипты, Tauri CLI. Релизы: Windows (MSI), Linux (deb/AppImage),
      macOS (DMG). Веб-версия публикуется на GitHub Pages.

  Архитектурные особенности:
    - Два режима: dev (Vite HMR, порт 8080) и release (статика из client/dist
      раздаётся tauri-plugin-localhost на порту 44548).
    - Брендинг Harrier закоммичен непосредственно в исходники клиента; сборка не
      требует применения или отката патчей.
    - Миграция настроек in.cinny.app → io.github.schadin.harrier при первом
      старте (копирование без удаления, маркер migration.success).
    - Версионирование десктопа синхронизировано: npm, Cargo.toml,
      tauri.conf.json; веб-legacy версионируется независимо.

  Доменная модель (bounded contexts):
    - presence — пользовательское присутствие и кастомный статус.
    - messaging — статусы сообщений, маркеры прочтения, вложения.
    - spaces — иерархия пространств, сортировка и навигация.
    - notifications — системные уведомления.
    - desktop-integration — трей, интеграция с Niri, буфер обмена, миграция.
    - appearance — брендинг, темы оформления, иконки.
    - delivery — сборка релизов, веб-публикация, i18n.
    - command-palette — быстрый переход и команды, история действий,
      непрочитанные чаты.
    - dstaskbot — интеграция с Matrix-ботом задач DsTaskBot: помощники команд,
      карточки задач, сворачивание служебных сообщений.

  Инвариант протокола: фичи строятся только на механизмах и данных, которые
  предоставляет протокол Matrix (события, read receipts, presence через
  matrix-js-sdk). Если в протоколе нет механизма — функция не реализуется и
  нестандартные обходные пути не изобретаются.

  Задачи ведутся как GitHub issues в schadin/harrier-project; ссылка на задачу —
  её номер на GitHub (`#NN`).
